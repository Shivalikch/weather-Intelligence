[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q -p no:cacheprovider
markers =
    mvp1: MVP-1 Map-Centric Viewer (implemented; must pass)
    mvp2: MVP-2 Alerting Engine (implemented; must pass)
    mvp3: MVP-3 Probabilistic Panels (implemented; must pass)
    mvp4: MVP-4 Severe-Weather Detection (implemented; must pass)
    mvp5: MVP-5 Regional Model Adapter (implemented; must pass)
    mvp6: MVP-6 CDS Export Gateway (implemented; must pass)
    mvp7: MVP-7 AI-Native Global Engine (implemented; must pass)
    integration: cross-MVP / whole-application integration tests
